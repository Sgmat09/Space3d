[package]
name = "space3d-render"
description = "Space3d wgpu forward renderer: meshes, materials, lights, GPU instancing, GPU culling, headless capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
## wgpu's ANGLE support (GLES through ANGLE's libEGL/libGLESv2 on macOS/Windows): the WebGL2-class
## GL backend on a desktop, for tests (`WGPU_BACKEND=gl`, `tests/gl.rs`).
angle = ["wgpu/angle"]

[dependencies]
space3d-core.workspace = true
space3d-tasks.workspace = true
wgpu.workspace = true
# The same naga as wgpu's; `glsl-out` lets custom-shader validation check GLSL ES 3.00 (WebGL2).
naga = { workspace = true, features = ["glsl-out"] }
glam.workspace = true
bytemuck.workspace = true
ahash.workspace = true
tracing.workspace = true
futures.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon.workspace = true
# Timer of the capture resolver task (runs on space3d-tasks' tokio runtime).
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGPU when the browser has it, WebGL2 otherwise. The fragile Send/Sync feature is required
# because engine resources must be `Send + Sync`; wasm32 without atomics is single-threaded.
wgpu = { workspace = true, features = ["webgl", "fragile-send-sync-non-atomic-wasm"] }

[dev-dependencies]
pollster.workspace = true
criterion.workspace = true
image.workspace = true

[[bench]]
name = "instancing"
harness = false
