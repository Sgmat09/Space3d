# TEMPLATE, not applied by kustomization.yaml. The values are placeholders: the production image
# refuses them. Create the real Secret without writing it to a file:
#
#   kubectl -n space3d create secret generic space3d-server-secrets \
#     --from-literal=SPACE3D_KEYS="k1:$(openssl rand -base64 32)" \
#     --from-literal=SPACE3D_FLEET_TOKEN="$(openssl rand -hex 24)" \
#     --from-literal=SPACE3D_ADMIN_TOKENS="$(openssl rand -hex 24)"
#
# or manage it with your secret operator (External Secrets, Sealed Secrets, SOPS, ...). Key rotation:
# docs/server.md §4 (`SPACE3D_KEYS` may list several keys, `k2:<b64>,k1:<b64>`).
apiVersion: v1
kind: Secret
metadata:
  name: space3d-server-secrets
  namespace: space3d
  labels:
    app.kubernetes.io/part-of: space3d
type: Opaque
stringData:
  SPACE3D_KEYS: "k1:REPLACE-WITH-BASE64-OF-32-RANDOM-BYTES"
  SPACE3D_FLEET_TOKEN: "REPLACE-WITH-24-RANDOM-BYTES-AS-HEX"
  SPACE3D_ADMIN_TOKENS: "REPLACE-WITH-24-RANDOM-BYTES-AS-HEX"
