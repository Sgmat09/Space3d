# OPTIONAL (not in kustomization.yaml; needs a CNI that enforces NetworkPolicy). Default-deny for
# everything in the namespace, then only what the stack needs:
#   game servers  -> player service :8080   (fleet WebSocket + checkpoint upload, they dial out)
#   ingress       -> player service :8080   (/v1; /internal stays blocked at the ingress)
#   anyone        -> game servers   :7777   (clients, through the ingress or a load balancer)
#   monitoring    -> every pod      :9090   (Prometheus scrapes /metrics)
# Adjust the two namespace names to your cluster before applying:
#   kubectl apply -f networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: space3d
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: player-service
  namespace: space3d
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: player-service
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: game-server
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: game-server
  namespace: space3d
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: game-server
  policyTypes: ["Ingress"]
  ingress:
    # Clients: the source address is the ingress controller or the load balancer, not the player.
    - ports:
        - { protocol: TCP, port: 7777 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics
  namespace: space3d
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: space3d
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 9090 }
