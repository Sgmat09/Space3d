[package]
name = "space3d-test"
description = "Space3d test harness: deterministic headless apps, input simulation, golden screenshots, determinism and performance assertions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
space3d-core.workspace = true
space3d-render.workspace = true
space3d-platform.workspace = true
# `serde` lets input scripts store winit `KeyCode`s by name.
winit = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
ron.workspace = true
thiserror.workspace = true
tracing.workspace = true
web-time.workspace = true
# Same version as [workspace.dependencies]; only the PNG codec is needed (keeps wasm32 builds lean).
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile.workspace = true
