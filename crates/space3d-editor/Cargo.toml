[package]
name = "space3d-editor"
description = "Space3d editor: scene hierarchy + inspector, play/pause/step, undo/redo, texture editor, model editor and the storybook viewer (egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
space3d-core.workspace = true
space3d-tasks.workspace = true
space3d-render.workspace = true
space3d-platform.workspace = true
space3d-ui.workspace = true
egui.workspace = true
space3d-assets.workspace = true
space3d-scene.workspace = true
space3d-stories.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Node", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlCanvasElement", "CssStyleDeclaration", "Blob", "BlobPropertyBag", "Url"] }

[dev-dependencies]
tempfile.workspace = true
