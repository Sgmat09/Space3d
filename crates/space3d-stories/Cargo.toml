[package]
name = "space3d-stories"
description = "Space3d storybook: isolated, parameterized, screenshot-able stories"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["engine"]
## Built-in engine storybook (`engine_storybook()`), including physics and particle stories.
engine = ["dep:space3d-physics", "particles"]
## Particle stories (`Engine/Particles/*`) in the engine storybook.
particles = ["dep:space3d-particles"]

[dependencies]
space3d-core.workspace = true
space3d-render.workspace = true
space3d-test.workspace = true
space3d-physics = { workspace = true, optional = true }
space3d-particles = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
web-time.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[example]]
name = "gallery"
required-features = ["engine"]
