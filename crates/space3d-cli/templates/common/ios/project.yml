# XcodeGen spec: `xcodegen generate` (in this directory) writes {{name}}.xcodeproj.
name: {{name}}
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    CARGO_PACKAGE: {{name}}-mobile
    RUST_LIB_NAME: {{crate_name}}_mobile
targets:
  {{name}}:
    type: application
    platform: iOS
    sources:
      - path: main.m
      - path: ../assets
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "{{title}}"
        UILaunchScreen: {}
        # iOS 27 SDK apps must use the UIScene life cycle; the engine registers this delegate
        # class (space3d_platform::IOS_SCENE_DELEGATE_CLASS) and shows the game in its scene.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: Space3dSceneDelegate
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{ios_bundle_id}}
        TARGETED_DEVICE_FAMILY: "1,2"
        "RUST_TARGET[sdk=iphoneos*]": aarch64-apple-ios
        "RUST_TARGET[sdk=iphonesimulator*]": aarch64-apple-ios-sim
        # The Rust library exists for arm64 only (Apple silicon simulators, devices).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # The static library by path: `-l` would pick a `.dylib` next to it (the crate's Android
        # cdylib, after a plain `cargo build --target aarch64-apple-ios*`). The frameworks are
        # what `cargo rustc … -- --print native-static-libs` lists for the engine.
        OTHER_LDFLAGS: $(PROJECT_DIR)/../target/$(RUST_TARGET)/$(CARGO_PROFILE)/lib$(RUST_LIB_NAME).a -lc++ -liconv -framework Metal -framework QuartzCore -framework UIKit -framework Foundation -framework CoreGraphics -framework CoreFoundation -framework AudioToolbox -framework AVFAudio -framework AVFoundation -framework CoreAudio -framework Security -framework SystemConfiguration
      configs:
        Debug:
          CARGO_PROFILE: debug
        Release:
          CARGO_PROFILE: release
    preBuildScripts:
      - name: Build Rust library
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          # Build scripts and proc-macros run on the Mac: give them the macOS SDK's libraries.
          if [ -n "${DEVELOPER_SDK_DIR:-}" ]; then
            export LIBRARY_PATH="${DEVELOPER_SDK_DIR}/MacOSX.sdk/usr/lib:${LIBRARY_PATH:-}"
          fi
          PROFILE_FLAG=""
          if [ "$CONFIGURATION" = "Release" ]; then PROFILE_FLAG="--release"; fi
          cd "$PROJECT_DIR/.."
          # Only the staticlib: the crate's cdylib (for Android) would be linked for iOS here,
          # against the macOS libraries LIBRARY_PATH points at, and fail.
          cargo rustc -p "$CARGO_PACKAGE" --lib --crate-type staticlib --target "$RUST_TARGET" $PROFILE_FLAG
    scheme: {}
