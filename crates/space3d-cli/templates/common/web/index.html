<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>{{title}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d12; color: #c9d1e0; font: 14px system-ui, sans-serif; overflow: hidden; }
    /* `!important`: the runner sets the canvas' CSS size from the window size; the page decides. */
    canvas#space3d { display: block; width: 100vw !important; height: 100vh !important; touch-action: none; outline: none; }
    #status { position: fixed; left: 12px; bottom: 10px; opacity: .7; pointer-events: none; }
  </style>
</head>
<body>
  <!-- The game renders into this canvas (see `canvas_id` in src/lib.rs). -->
  <canvas id="space3d" tabindex="0"></canvas>
  <div id="status">loading…</div>
  <script type="module">
    // `space3d build --target web` bundles the game as {{name}}.js + {{name}}_bg.wasm.
    import init from "./{{name}}.js";
    const status = document.getElementById("status");
    init()
      .then(() => status.remove())
      .catch((e) => { status.textContent = "failed to start: " + e; console.error(e); });
  </script>
</body>
</html>
