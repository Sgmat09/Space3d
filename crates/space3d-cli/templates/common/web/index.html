<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <!-- No favicon request (a 404 in the console); replace with your icon. -->
  <link rel="icon" href="data:,">
  <title>{{title}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d12; color: #c9d1e0; font: 14px system-ui, sans-serif; overflow: hidden; }
    /* `!important`: the runner sets the canvas' CSS size from the window size; the page decides. */
    canvas#space3d { display: block; width: 100vw !important; height: 100vh !important; touch-action: none; outline: none; }
    #status { position: fixed; left: 12px; bottom: 10px; opacity: .7; pointer-events: none; }
    #status.error { opacity: 1; color: #f88; }
  </style>
</head>
<body>
  <!-- The game renders into this canvas (see `canvas_id` in src/lib.rs). -->
  <canvas id="space3d" tabindex="0"></canvas>
  <div id="status">loading…</div>
  <script type="module">
    // `space3d build --target web` bundles the game as {{name}}.js + {{name}}_bg.wasm.
    import init from "./{{name}}.js";
    const status = document.getElementById("status");
    const canvas = document.getElementById("space3d");
    // `init()` resolves once the game starts; the engine then creates the renderer and tells
    // the page: `space3d-ready`, or `space3d-error` with the reason in `detail` (no WebGPU or
    // WebGL2, or the browser lost the GPU context: offer a reload).
    canvas.addEventListener("space3d-ready", () => status.remove());
    canvas.addEventListener("space3d-error", (e) => {
      status.textContent = e.detail;
      status.className = "error";
    });
    init().catch((e) => { status.textContent = "failed to start: " + e; status.className = "error"; console.error(e); });
  </script>
</body>
</html>
