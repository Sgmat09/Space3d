[package]
name = "space3d-platform"
description = "Space3d platform layer: winit runner (desktop, web, Android, iOS), input and action mapping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
space3d-core.workspace = true
space3d-render.workspace = true
winit.workspace = true
glam.workspace = true
tracing.workspace = true
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement", "Navigator"] }
console_error_panic_hook.workspace = true
tracing-wasm.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
image.workspace = true
space3d-tasks.workspace = true

# OS keyboard-layout tables, read on the main thread (macOS Text Input Sources are
# main-thread only; libtest runs tests on worker threads).
[[test]]
name = "os_layout"
harness = false

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
# `Activity.isDestroyed()`: winit 0.30 ignores Android's Destroy event (see `mobile`).
jni.workspace = true
