[package]
name = "space3d-platform"
description = "Space3d platform layer: winit runner (desktop, web, Android, iOS), input and action mapping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
space3d-core.workspace = true
space3d-render.workspace = true
winit.workspace = true
glam.workspace = true
tracing.workspace = true
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
console_error_panic_hook.workspace = true
tracing-wasm.workspace = true

[dev-dependencies]
image.workspace = true
space3d-tasks.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
