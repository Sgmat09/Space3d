[package]
name = "space3d-audio"
description = "Space3d audio: kira-based playback, mixer buses, tweens and spatial emitters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
space3d-core.workspace = true
kira.workspace = true
glam.workspace = true
tracing.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The Web Audio output (`src/web.rs`): kira's cpal backend, started at the first user gesture.
send_wrapper.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["AudioContext", "AudioContextState", "BaseAudioContext", "EventTarget", "Navigator", "UserActivation", "Window"] }
