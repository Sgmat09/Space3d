[package]
name = "space3d-particles"
description = "Space3d particles: data-driven effects (sprites, ribbons, beams), GPU and CPU simulation, drawn as a render node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
space3d-core.workspace = true
space3d-render.workspace = true
serde.workspace = true
ron.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytemuck.workspace = true
ahash.workspace = true

[dev-dependencies]
pollster.workspace = true
proptest.workspace = true
image.workspace = true
space3d-test.workspace = true
# WGSL → GLSL ES 3.00 (WebGL2) translation of the sprite shader in the unit tests.
naga = { workspace = true, features = ["wgsl-in", "glsl-out"] }
