name: Site
# Builds the space3d.dev container (site/Dockerfile). On PRs: build only. On main / release:
# push ghcr.io/spacecorps/space3d-site and (optional) trigger the Sliplane redeploy.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "integrations/**", "README.md", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "integrations/**", "README.md", ".github/workflows/site.yml"]
  workflow_call:
    inputs:
      version_tag: { type: string, required: false, default: "" }
    secrets:
      SLIPLANE_DEPLOY_HOOK: { required: false }
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/spacecorps/space3d-site
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || inputs.version_tag != '' }}
            type=raw,value=${{ inputs.version_tag }},enable=${{ inputs.version_tag != '' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: site/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Sliplane: create the service from this image once, then add its deploy webhook URL as the
      # repo secret SLIPLANE_DEPLOY_HOOK. Skipped while the secret is unset.
      - name: Redeploy on Sliplane
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env: { HOOK: "${{ secrets.SLIPLANE_DEPLOY_HOOK }}" }
        run: '[ -z "$HOOK" ] && echo "SLIPLANE_DEPLOY_HOOK not set; skipping" || curl -fsS -X POST "$HOOK"'
