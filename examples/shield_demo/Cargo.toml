[package]
name = "shield_demo"
description = "Space3d example: a 3D shield for SpaceCorps 2027 hugging each hull (render node, WGSL), with per-shot waves, piercing, break, a group-shield bubble and the quality tiers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
space3d = { workspace = true, features = ["particles"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
web-sys = { workspace = true, features = ["Location", "UrlSearchParams", "Window"] }
